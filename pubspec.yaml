name: ditonton
description: A movie and tv series catalogue Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  core:
    path: packages/core
  about:
    path: packages/about
  movie:
    path: packages/movie
  tv:
    path: packages/tv
  search:
    path: packages/search
  watchlist:
    path: packages/watchlist

  flutter_bloc: ^9.1.1
  get_it: ^7.7.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  rxdart: ^0.28.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  mockito: ^5.0.8
  build_runner: ^2.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/certificates/
