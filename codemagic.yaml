workflows:
  default-workflow:
    name: Ditonton CI
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          for pkg in packages/core packages/about packages/movie packages/tv packages/search packages/watchlist .; do
            echo "Installing dependencies in $pkg"
            (cd $pkg && flutter pub get)
          done
      - name: Analyze code
        script: |
          set -euo pipefail
          for pkg in packages/core packages/about packages/movie packages/tv packages/search packages/watchlist .; do
            echo "Analyzing $pkg"
            (cd $pkg && flutter analyze)
          done
      - name: Run tests with coverage
        script: |
          set -euo pipefail
          for pkg in packages/core packages/about packages/movie packages/tv packages/search packages/watchlist .; do
            echo "Testing $pkg"
            (cd $pkg && flutter test --coverage)
          done
    test:
      ignore_failure: false
