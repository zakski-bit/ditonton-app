name: core
description: Core module containing common utilities, database, styles, failure handling, and SSL pinning.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.8
  build_runner: ^2.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/certificates/
